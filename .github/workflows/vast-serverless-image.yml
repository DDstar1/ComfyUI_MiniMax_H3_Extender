name: Build Vast serverless image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vast-serverless-image.yml"
      - ".dockerignore"
      - "Dockerfile.vast"
      - "extra_model_paths.runpod-volume.yaml"
      - "requirements.txt"
      - "**/*.py"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=vast-latest
            type=sha,prefix=vast-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vast
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
